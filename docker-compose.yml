services:

  postgres:
    image: postgres:18
    container_name: book-search-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpassword

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
      - ./books.csv:/data/books.csv:ro

volumes:
  postgres-data: